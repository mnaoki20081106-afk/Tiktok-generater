<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サイトジェネレーター</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1a1a1a;border-radius:20px;padding:32px 28px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px}
h1{font-size:20px;font-weight:700}
.sub{font-size:13px;color:rgba(255,255,255,.45);margin-top:4px;line-height:1.5}
.sec{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:-8px}
.field{display:flex;flex-direction:column;gap:8px}
.fl{font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
input[type=text],input[type=url]{background:#2a2a2a;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px 14px;color:#fff;font-size:15px;outline:none;width:100%;transition:border-color .2s;font-family:inherit}
input:focus{border-color:rgba(255,255,255,.35)}
.hint{font-size:12px;color:rgba(255,255,255,.3);margin-top:4px;line-height:1.6}
.divider{height:1px;background:rgba(255,255,255,.07)}
.file-btn{display:block;background:#2a2a2a;border:1.5px dashed rgba(255,255,255,.15);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;font-size:14px;color:rgba(255,255,255,.5)}
.file-btn:hover{border-color:rgba(255,255,255,.35);background:#333}
.file-btn.selected{border-color:#fe2c55;color:#fe2c55;border-style:solid}
input[type=file]{display:none}
.fb{display:inline-block;background:rgba(254,44,85,.15);color:#fe2c55;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:4px}
.btn-deploy{display:block;width:100%;background:linear-gradient(90deg,#fe2c55,#ff4d6d);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-deploy:disabled{opacity:.4;cursor:not-allowed}
.status{font-size:13px;text-align:center;color:rgba(255,255,255,.5);min-height:18px;line-height:1.6}
.status.ok{color:#4ade80}.status.err{color:#fe2c55}
.result{background:#1e2e1e;border:1px solid rgba(74,222,128,.3);border-radius:10px;padding:14px;font-size:13px;color:#4ade80;word-break:break-all;display:none;text-align:center;line-height:1.8}
.result a{color:#4ade80}
.info{background:#222;border-radius:10px;padding:14px 16px;font-size:12px;color:rgba(255,255,255,.45);line-height:1.8;border:1px solid rgba(255,255,255,.06)}
.info strong{color:rgba(255,255,255,.75)}
</style>
</head>
<body>
<div class="card">
  <div>
    <h1>サイトジェネレーター</h1>
    <div class="sub">Worker名と画像を入力するだけで自動デプロイ</div>
  </div>

  <div class="info">
    この画面(GitHub Pages)はデプロイAPIを叩くだけです。実際のデプロイ処理はCloudflare Worker側で行われ、
    <strong>CF_ACCOUNT_ID</strong> と <strong>CF_API_TOKEN</strong> はそのWorkerのVariables and Secretsに保存されています。
  </div>

  <div class="sec">API設定</div>
  <div class="field">
    <label class="fl">デプロイAPIのURL</label>
    <input type="url" id="apiBase" placeholder="https://your-generator-api.your-subdomain.workers.dev">
    <div class="hint">generater-worker.js をデプロイしたWorkerのURL。一度入力すればブラウザに保存されます</div>
  </div>

  <div class="divider"></div>

  <div class="sec">デプロイ設定</div>

  <div class="field">
    <label class="fl">Worker名</label>
    <input type="text" id="workerName" placeholder="例: my-tiktok-site">
    <div class="hint">英小文字・数字・ハイフンのみ。<strong>worker名.subdomain.workers.dev</strong> になります</div>
  </div>
  <div class="field">
    <label class="fl">TikTokプロフィールURL</label>
    <input type="url" id="tiktokUrl" placeholder="https://www.tiktok.com/@username">
  </div>
  <div class="field">
    <label class="fl">OGPタイトル <span style="color:rgba(255,255,255,.3);font-weight:400">(SNSシェア時のタイトル)</span></label>
    <input type="text" id="ogpTitle" placeholder="例: 俺の動画見て">
  </div>

  <div class="divider"></div>

  <div class="field">
    <label class="fl">背景画像</label>
    <label class="file-btn" id="bgLabel" for="bgInput">タップして選択</label>
    <input type="file" id="bgInput" accept="image/*">
  </div>
  <div class="field">
    <label class="fl">OGP画像</label>
    <label class="file-btn" id="ogpLabel" for="ogpInput">タップして選択</label>
    <input type="file" id="ogpInput" accept="image/*">
  </div>
  <div class="field">
    <label class="fl">アプリアイコン</label>
    <label class="file-btn" id="iconLabel" for="iconInput">タップして選択</label>
    <input type="file" id="iconInput" accept="image/*">
  </div>

  <button class="btn-deploy" id="deployBtn" disabled>自動デプロイ</button>
  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
</div>
<script>
let bgData=null,ogpData=null,iconData=null;

const apiBaseInput=document.getElementById('apiBase');
apiBaseInput.value=localStorage.getItem('generatorApiBase')||'';
apiBaseInput.addEventListener('input',()=>{
  localStorage.setItem('generatorApiBase',apiBaseInput.value.trim());
  check();
});

function onFile(inputId,labelId,setter){
  document.getElementById(inputId).addEventListener('change',function(){
    if(this.files.length>0){
      setter(this.files[0]);
      document.getElementById(labelId).textContent=this.files[0].name;
      document.getElementById(labelId).classList.add('selected');
    }
    check();
  });
}
onFile('bgInput','bgLabel',f=>bgData=f);
onFile('ogpInput','ogpLabel',f=>ogpData=f);
onFile('iconInput','iconLabel',f=>iconData=f);
['workerName','tiktokUrl','ogpTitle'].forEach(id=>document.getElementById(id).addEventListener('input',check));

function check(){
  document.getElementById('deployBtn').disabled=!(
    bgData&&ogpData&&iconData&&
    apiBaseInput.value.trim()&&
    document.getElementById('workerName').value.trim()&&
    document.getElementById('tiktokUrl').value.trim()&&
    document.getElementById('ogpTitle').value.trim()
  );
}
function setStatus(msg,type){
  const el=document.getElementById('status');
  el.textContent=msg;el.className='status'+(type?' '+type:'');
}
document.getElementById('deployBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('deployBtn');
  btn.disabled=true;
  document.getElementById('result').style.display='none';
  setStatus('デプロイ中... しばらくお待ちください');
  try{
    const apiBase=apiBaseInput.value.trim().replace(/\/+$/,'');
    const form=new FormData();
    form.append('workerName',document.getElementById('workerName').value.trim().toLowerCase());
    form.append('tiktokUrl',document.getElementById('tiktokUrl').value.trim());
    form.append('title',document.getElementById('ogpTitle').value.trim());
    form.append('background',bgData,'background.png');
    form.append('ogpImage',ogpData,'ogp-image.png');
    form.append('appIcon',iconData,'app-icon.png');
    const res=await fetch(apiBase+'/deploy',{method:'POST',body:form});
    const json=await res.json();
    if(!res.ok||!json.success) throw new Error(json.error||'デプロイ失敗');
    setStatus('✓ デプロイ完了！','ok');
    const r=document.getElementById('result');
    r.innerHTML='公開URL: <a href="'+json.url+'" target="_blank">'+json.url+'</a><br><small style="opacity:.6">（反映まで数秒かかる場合があります）</small>';
    r.style.display='block';
  }catch(e){
    setStatus('エラー: '+e.message,'err');
  }
  btn.disabled=false;
});
</script>
</body>
</html>
